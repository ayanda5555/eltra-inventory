<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELTRA-CONNECT Inventory</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="screen-login" class="screen active">
        <div class="login-box">
            <h1>ELTRA-CONNECT</h1>
            <p>Inventory & Asset Tracking</p>
            <div class="input-group">
                <label>User ID or Email</label>
                <input type="text" id="login-user" placeholder="e.g. USR-001">
            </div>
            <div class="input-group">
                <label>PIN</label>
                <input type="password" id="login-pin" placeholder="****" maxlength="6">
            </div>
            <button onclick="doLogin()" class="btn primary">Log In</button>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="screen-dashboard" class="screen">
        <header>
            <h2 id="welcome-text">Welcome</h2>
            <button onclick="doLogout()" class="btn small danger">Logout</button>
        </header>

        <div class="dashboard-stats">
            <div class="stat-card">
                <h3>Total Items</h3>
                <p id="stat-items">0</p>
            </div>
            <div class="stat-card">
                <h3>Assigned Assets</h3>
                <p id="stat-assets">0</p>
            </div>
        </div>

        <div class="quick-actions">
            <button class="action-btn" onclick="openScanner()">📷 Scan QR Code</button>
            <button class="action-btn" onclick="showScreen('screen-receive'); loadDropdowns();">📥 Receive Stock</button>
            <button class="action-btn" onclick="showScreen('screen-issue'); loadDropdowns();">📤 Issue Stock</button>
            <button class="action-btn" onclick="showScreen('screen-print'); loadLabels();">🖨️ Print Labels</button>
        </div>

        <div class="low-stock-section">
            <h3>Low Stock Alerts</h3>
            <ul id="low-stock-list"><li>Loading...</li></ul>
        </div>
    </div>

    <!-- 3. RECEIVE STOCK SCREEN -->
    <div id="screen-receive" class="screen">
        <header>
            <button onclick="showScreen('screen-dashboard')" class="btn small">← Back</button>
            <h2>Receive Stock</h2>
        </header>
        <div class="form-box">
            <label>Select Item</label>
            <select id="rec-item"></select>
            <label>Quantity Received</label>
            <input type="number" id="rec-qty" min="1">
            <label>Invoice / GRN Number</label>
            <input type="text" id="rec-ref" placeholder="e.g. INV-1234">
            <button onclick="submitReceive()" class="btn primary" style="margin-top:15px;">Record Receipt</button>
        </div>
    </div>

    <!-- 4. ISSUE STOCK SCREEN -->
    <div id="screen-issue" class="screen">
        <header>
            <button onclick="showScreen('screen-dashboard')" class="btn small">← Back</button>
            <h2>Issue Stock</h2>
        </header>
        <div class="form-box">
            <label>Select Item</label>
            <select id="iss-item"></select>
            <label>Quantity to Issue</label>
            <input type="number" id="iss-qty" min="1">
            <button onclick="submitIssue()" class="btn primary" style="margin-top:15px;">Record Issue</button>
        </div>
    </div>

    <!-- 5. PRINT LABELS SCREEN -->
    <div id="screen-print" class="screen">
        <header>
            <button onclick="showScreen('screen-dashboard')" class="btn small">← Back</button>
            <h2>Print QR Labels</h2>
        </header>
        <button onclick="window.print()" class="btn primary" style="margin-bottom: 15px;">🖨️ Print This Page</button>
        <div id="label-container" class="label-grid">
            <!-- Labels will be injected here -->
        </div>
    </div>

    <!-- 6. SCANNER SCREEN -->
    <div id="screen-scanner" class="screen">
        <header>
            <button onclick="closeScanner()" class="btn small">← Back</button>
            <h2>Scan QR Code</h2>
        </header>
        <div id="reader"></div>
        <div id="scan-result" class="hidden">
            <h3 id="scanned-title">Item Found</h3>
            <p id="scanned-details"></p>
            <button onclick="closeScanner()" class="btn primary">Done</button>
        </div>
    </div>

    <script src="qr-generator.js"></script>
    <script src="app.js"></script>
    <script src="scanner.js"></script>
</body>
</html>
